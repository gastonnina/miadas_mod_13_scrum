[project]
name = "premium-customers"
version = "0.1.0"
description = "Sistema de identificación de clientes premium impulsado por IA que utiliza datos de comercio electrónico de Olist"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "optuna>=3.6.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.29.0",
    "streamlit>=1.35.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "missingno",
    "black>=24.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
