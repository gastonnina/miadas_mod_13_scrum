# ─────────────────────────────────────────────────────────────────────────────
# Olist Premium-Customer Pipeline + MVP Dashboard
#
# Services
# ─────────
# pipeline      One-shot run (use `docker compose run pipeline` to trigger manually)
# pipeline-cron Runs the pipeline on a cron schedule (default: every 3 months)
# dashboard     MVP Streamlit para Demo Day (puerto 8501)
#
# Usage
# ─────
# Full rebuild (ignores checkpoint):
#   docker compose run pipeline python -m scripts.pipeline --full
#
# Incremental run (skips if nothing new):
#   docker compose run pipeline
#
# Start the scheduler:
#   docker compose up pipeline-cron
#
# Change the schedule (every month):
#   PIPELINE_CRON="0 2 1 * *" docker compose up pipeline-cron
#
# Levantar el dashboard MVP:
#   docker compose up dashboard
#   Abrir en http://localhost:8501
#
# Levantar la API minima (stretch goal):
#   docker compose up api
#   Docs en http://localhost:8000/docs
#   Health: GET http://localhost:8000/health
#   Predict: POST http://localhost:8000/predict
# ─────────────────────────────────────────────────────────────────────────────

x-pipeline-base: &pipeline-base
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    PROJECT_ROOT: /app
    RAW_DIR: /app/data/raw
    PROCESSED_DIR: /app/data/processed
    PIPELINE_STATE_FILE: /app/pipeline_state.json
  volumes:
    - ./data/raw:/app/data/raw:ro
    - ./data/processed:/app/data/processed
    # Mount checkpoint file so state persists across container restarts
    - ./notebooks/sprint_02_pipeline/pipeline_state.json:/app/pipeline_state.json

services:
  # ── One-shot pipeline runner ──────────────────────────────────────────────
  pipeline:
    <<: *pipeline-base
    profiles: ["pipeline"]
    command: ["python", "-m", "scripts.pipeline"]

  # ── Scheduled runner (cron inside container) ──────────────────────────────
  pipeline-cron:
    <<: *pipeline-base
    profiles: ["pipeline"]
    # Override cron schedule via PIPELINE_CRON env var (default: every 3 months)
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIPELINE_CRON: "${PIPELINE_CRON:-0 2 1 1,4,7,10 *}"
    restart: unless-stopped

  # ── MVP Streamlit Dashboard (Demo Day) ────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    environment:
      PYTHONPATH: /app
    restart: unless-stopped

  # ── API minima de scoring (stretch goal S4-DE-04) ─────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      PYTHONPATH: /app
    restart: unless-stopped
